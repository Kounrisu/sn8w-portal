@if (project().url) {
  @if (project().availability === 'active') {
    <a
      class="project-availability__visit"
      [href]="project().url"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ i18n.dict().projectCard.visit }}
      <span class="visually-hidden">— {{ project().name }}</span>
    </a>
  } @else if (project().activationRequestedAt) {
    <span class="project-availability__requested">{{ i18n.dict().projectCard.requestSent }}</span>
  } @else {
    <button
      type="button"
      class="project-availability__request"
      [disabled]="requesting()"
      (click)="request()"
    >
      {{ i18n.dict().projectCard.requestAccess }}
      <span class="visually-hidden">— {{ project().name }}</span>
    </button>
  }
}
