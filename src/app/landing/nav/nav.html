<header class="nav" [class.nav--scrolled]="scrolled()" sn8wSpotlight>
  <div class="container nav__inner">
    <a
      class="nav__logo"
      routerLink="/"
      fragment="top"
      routerLinkActive="nav__logo--current"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      Sn<span class="accent">8</span>w
      <span class="visually-hidden">— {{ i18n.dict().sitemap.home }}</span>
    </a>

    <div class="nav__actions">
      <nav class="nav__icons" aria-label="Primary">
        <a
          class="nav__pref-btn"
          sn8wSpotlight
          routerLink="/workshop"
          routerLinkActive="nav__link--active"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="i18n.dict().workshop.navLabel"
          [matTooltip]="i18n.dict().workshop.navLabel"
        >
          <mat-icon aria-hidden="true">build</mat-icon>
        </a>

        @if (auth.isAuthenticated()) {
          <a
            class="nav__pref-btn"
            sn8wSpotlight
            routerLink="/todo"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="i18n.dict().nav.todo"
            [matTooltip]="i18n.dict().nav.todo"
          >
            <mat-icon aria-hidden="true">checklist</mat-icon>
          </a>
          <a
            class="nav__pref-btn"
            sn8wSpotlight
            routerLink="/diary"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="i18n.dict().nav.diary"
            [matTooltip]="i18n.dict().nav.diary"
          >
            <mat-icon aria-hidden="true">menu_book</mat-icon>
          </a>
          <a
            class="nav__pref-btn"
            sn8wSpotlight
            routerLink="/admin"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="i18n.dict().nav.admin"
            [matTooltip]="i18n.dict().nav.admin"
          >
            <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
          </a>
          <a
            class="nav__pref-btn"
            sn8wSpotlight
            routerLink="/analytics"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="i18n.dict().nav.analytics"
            [matTooltip]="i18n.dict().nav.analytics"
          >
            <mat-icon aria-hidden="true">analytics</mat-icon>
          </a>
        }

        <button
          type="button"
          class="nav__pref-btn"
          sn8wSpotlight
          [matMenuTriggerFor]="langMenu"
          [attr.aria-label]="i18n.dict().common.language + ': ' + i18n.langLabels[i18n.lang()]"
          [matTooltip]="i18n.langLabels[i18n.lang()]"
        >
          <sn8w-flag [lang]="i18n.lang()" />
        </button>

        <mat-menu #langMenu="matMenu" class="sn8w-lang-menu">
          @for (lang of i18n.supportedLangs; track lang) {
            <button
              type="button"
              mat-menu-item
              [attr.aria-current]="lang === i18n.lang() ? 'true' : null"
              (click)="setLang(lang)"
            >
              <span class="nav__lang-option">
                <sn8w-flag [lang]="lang" />
                {{ i18n.langLabels[lang] }}
              </span>
            </button>
          }
        </mat-menu>

        <!-- Two themes, so a toggle rather than a picker: the icon shows
             the theme it switches *to*, which is the convention every
             dark-mode toggle uses. -->
        <button
          type="button"
          class="nav__pref-btn"
          sn8wSpotlight
          [attr.aria-label]="i18n.dict().common.theme + ': ' + themeLabel()[nextTheme()]"
          [matTooltip]="themeLabel()[nextTheme()]"
          (click)="setTheme(nextTheme())"
        >
          <mat-icon aria-hidden="true">{{ nextTheme() === 'frost' ? 'dark_mode' : 'light_mode' }}</mat-icon>
        </button>

        <a
          class="nav__pref-btn"
          [class.nav__pref-btn--customized]="prefs.hasCustomizations()"
          sn8wSpotlight
          routerLink="/parametres-accessibilite"
          routerLinkActive="nav__link--active"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="i18n.dict().preferences.navLabel + (prefs.hasCustomizations() ? ' (' + i18n.dict().preferences.customizedBadge + ')' : '')"
          [matTooltip]="i18n.dict().preferences.navLabel"
        >
          <mat-icon aria-hidden="true">accessible</mat-icon>
        </a>

        @if (auth.isAuthenticated()) {
          <button
            type="button"
            class="nav__pref-btn nav__session-btn--logged-in"
            sn8wSpotlight
            [attr.aria-label]="i18n.dict().nav.logout"
            [matTooltip]="i18n.dict().nav.logout"
            (click)="logout()"
          >
            <mat-icon aria-hidden="true">logout</mat-icon>
          </button>
        } @else {
          <a
            class="nav__pref-btn nav__session-btn--logged-out"
            sn8wSpotlight
            routerLink="/login"
            [queryParams]="{ returnUrl: currentUrl() }"
            routerLinkActive="nav__link--active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="i18n.dict().nav.login"
            [matTooltip]="i18n.dict().nav.login"
          >
            <mat-icon aria-hidden="true">login</mat-icon>
          </a>
        }
      </nav>
    </div>
  </div>
</header>
