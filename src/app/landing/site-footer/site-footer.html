<!-- `id="contact"` lives here now that the final CTA section is gone: the
     nav's Contact link needs a target, and the footer is where the email
     and profile links actually are. -->
<footer id="contact" class="site-footer">
  <div class="container site-footer__inner">
    <a class="site-footer__logo" href="#top">
      Sn<span class="accent">8</span>w
    </a>

    <nav class="footer-links" aria-label="Contact">
      <a [href]="profiles.github" target="_blank" rel="noopener noreferrer">
        <mat-icon aria-hidden="true">code</mat-icon>
        {{ i18n.dict().footer.github }}
      </a>
      <a [href]="profiles.linkedIn" target="_blank" rel="noopener noreferrer">
        <mat-icon aria-hidden="true">work_outline</mat-icon>
        LinkedIn
      </a>
      <a [href]="profiles.frontendMasters" target="_blank" rel="noopener noreferrer">
        <mat-icon aria-hidden="true">school</mat-icon>
        Frontend Masters
      </a>
      <a routerLink="/behind-the-scenes">
        <mat-icon aria-hidden="true">construction</mat-icon>
        {{ i18n.dict().behindTheScenes.navLabel }}
      </a>
      <button type="button" class="email-copy" (click)="copyEmail()">
        <mat-icon aria-hidden="true">mail_outline</mat-icon>
        {{ email }}
      </button>
    </nav>

    <!-- Build provenance. Moved down from the nav: it is developer chrome,
         and the top bar is the first thing a recruiter reads. -->
    <span
      class="site-footer__version"
      [matTooltip]="i18n.dict().footer.deployedCommit + ': ' + commit + ' — ' + commitMessage"
      matTooltipPosition="above"
    >
      {{ buildLabel() }}
    </span>
  </div>
</footer>
