<section id="products" class="flagship-section" aria-labelledby="products-heading">
  <div class="container">
    <div class="section-head">
      <p class="kicker">{{ i18n.dict().flagshipSection.kicker }}</p>
      <h2 id="products-heading" class="section-title">{{ i18n.dict().flagshipSection.title }}</h2>
      <p class="section-lede">{{ i18n.dict().flagshipSection.lede }}</p>
      @if (i18n.dict().flagshipSection.learningNote; as note) {
        <p class="section-lede">{{ note }}</p>
      }
    </div>
    <sn8w-project-count [count]="projects.flagship().length" [total]="projects.visible().length" [label]="copy().shown" />
    <div class="flagship-list">
      @for (product of projects.flagship(); track product.id; let i = $index) {
        <sn8w-project-card [project]="product" [index]="i" />
      }
    </div>
    <a class="btn btn--secondary" routerLink="/projects">{{ copy().viewAll }} →</a>
  </div>
</section>
