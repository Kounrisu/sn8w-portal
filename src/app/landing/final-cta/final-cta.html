<section class="cta-section" aria-labelledby="cta-heading">
  <div class="container cta-inner">
    <h2 id="cta-heading" class="cta-title">{{ i18n.dict().ctaSection.title }}</h2>
    <p class="cta-lede">{{ i18n.dict().ctaSection.lede }}</p>
    <div class="cta-actions">
      <a class="btn btn--primary" routerLink="/" fragment="products">{{ i18n.dict().hero.ctaPrimary }}</a>
      <a class="btn btn--secondary" href="https://github.com/Kounrisu" target="_blank" rel="noopener noreferrer">
        {{ i18n.dict().hero.ctaSecondary }}
      </a>
    </div>
  </div>
</section>
