<svg
  class="scene"
  viewBox="0 0 420 380"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <defs>
    <g id="blossom">
      <ellipse transform="rotate(0) translate(7,0)" rx="6" ry="3.6" class="petal" />
      <ellipse transform="rotate(72) translate(7,0)" rx="6" ry="3.6" class="petal" />
      <ellipse transform="rotate(144) translate(7,0)" rx="6" ry="3.6" class="petal" />
      <ellipse transform="rotate(216) translate(7,0)" rx="6" ry="3.6" class="petal" />
      <ellipse transform="rotate(288) translate(7,0)" rx="6" ry="3.6" class="petal" />
      <circle r="2.2" class="stamen" />
    </g>
    <ellipse id="bud" rx="3.6" ry="5" class="bud" />
  </defs>

  <!-- branch, with two small offshoots for a fuller, less single-line look -->
  <path
    class="branch"
    d="M 10 320 Q 130 300 190 250 T 300 150 Q 330 128 400 110"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path class="branch" d="M 210 235 Q 195 205 205 175" stroke-width="3" stroke-linecap="round" />
  <path class="branch" d="M 335 132 Q 350 148 348 168" stroke-width="2.5" stroke-linecap="round" />

  <!-- dense blossom cluster 1 -->
  <use href="#blossom" transform="translate(112,300) scale(1.1)" />
  <use href="#blossom" transform="translate(130,290) scale(0.95) rotate(35)" />
  <use href="#blossom" transform="translate(108,282) scale(0.8) rotate(-20)" />
  <use href="#blossom" transform="translate(140,306) scale(0.85) rotate(60)" />
  <use href="#blossom" transform="translate(122,312) scale(0.7) rotate(-40)" />
  <use href="#bud" transform="translate(96,296) rotate(200) scale(0.9)" />
  <use href="#bud" transform="translate(150,282) rotate(160) scale(0.75)" />

  <!-- dense blossom cluster 2 (at the branch fork, near the squirrel) -->
  <use href="#blossom" transform="translate(200,182) scale(1.05) rotate(-15)" />
  <use href="#blossom" transform="translate(220,170) scale(0.9) rotate(25)" />
  <use href="#blossom" transform="translate(195,165) scale(0.8) rotate(50)" />
  <use href="#blossom" transform="translate(228,190) scale(0.75) rotate(-35)" />
  <use href="#blossom" transform="translate(205,205) scale(0.65) rotate(10)" />
  <use href="#bud" transform="translate(238,175) rotate(140) scale(0.8)" />
  <use href="#bud" transform="translate(184,192) rotate(-60) scale(0.7)" />

  <!-- dense blossom cluster 3 -->
  <use href="#blossom" transform="translate(340,132) scale(1) rotate(-10)" />
  <use href="#blossom" transform="translate(362,120) scale(0.9) rotate(30)" />
  <use href="#blossom" transform="translate(336,112) scale(0.75) rotate(-45)" />
  <use href="#blossom" transform="translate(378,132) scale(0.7) rotate(15)" />
  <use href="#blossom" transform="translate(352,150) scale(0.6) rotate(55)" />
  <use href="#bud" transform="translate(388,145) rotate(120) scale(0.8)" />
  <use href="#bud" transform="translate(322,124) rotate(-80) scale(0.7)" />

  <!-- small offshoot cluster -->
  <use href="#blossom" transform="translate(348,172) scale(0.7) rotate(20)" />
  <use href="#bud" transform="translate(346,182) rotate(30) scale(0.65)" />

  <!-- a fourth, smaller cluster where the squirrel used to sit, so the
       branch reads as continuously in bloom rather than leaving a gap -->
  <use href="#blossom" transform="translate(255,205) scale(0.85) rotate(-20)" />
  <use href="#blossom" transform="translate(272,218) scale(0.65) rotate(25)" />
  <use href="#bud" transform="translate(240,215) rotate(190) scale(0.7)" />

  <!-- drifting detached petals -->
  <use href="#blossom" transform="translate(60,120) scale(0.32) rotate(40)" class="drift" />
  <use href="#blossom" transform="translate(320,260) scale(0.28) rotate(-25)" class="drift" />
  <use href="#blossom" transform="translate(90,220) scale(0.24) rotate(60)" class="drift" />
  <use href="#blossom" transform="translate(270,290) scale(0.22) rotate(80)" class="drift" />
  <use href="#blossom" transform="translate(160,90) scale(0.26) rotate(-50)" class="drift" />
  <use href="#blossom" transform="translate(230,140) scale(0.24) rotate(15)" class="drift" />
</svg>
