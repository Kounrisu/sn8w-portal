<div class="hero__bg" aria-hidden="true">
  <div class="hero__scrim"></div>
</div>

<div class="container hero__inner">
  <div class="hero__copy" sn8wSpotlight>
    <p class="kicker">{{ i18n.dict().hero.kicker }}</p>
    <h1 class="hero__name">{{ i18n.dict().hero.headlineMain }}</h1>
    <p class="hero__role">{{ i18n.dict().hero.headlineAccent }}</p>
    <p class="hero__lede">{{ i18n.dict().hero.lede }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" routerLink="/" fragment="studio">{{ i18n.dict().hero.ctaPrimary }}</a>
      <a class="btn btn--secondary" [href]="profiles.github" target="_blank" rel="noopener noreferrer">
        {{ i18n.dict().hero.ctaSecondary }}
      </a>
      <!-- Brand names, so the labels stay untranslated. Same URLs as the
           footer, kept on the component rather than repeated inline. -->
      <a class="btn btn--secondary" [href]="profiles.linkedIn" target="_blank" rel="noopener noreferrer">
        LinkedIn
      </a>
      <a class="btn btn--secondary" [href]="profiles.frontendMasters" target="_blank" rel="noopener noreferrer">
        Frontend Masters
      </a>
    </div>
  </div>
</div>
