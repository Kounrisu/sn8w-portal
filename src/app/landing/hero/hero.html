<div class="hero__bg" aria-hidden="true">
  @if (!videoFailed()) {
    <video
      #videoEl
      class="hero__video"
      autoplay
      [muted]="true"
      [defaultMuted]="true"
      loop
      playsinline
      preload="auto"
      (error)="onVideoError()"
    >
      <source src="videos/hero-intro.mp4" type="video/mp4" />
    </video>
  }
  <div class="hero__scrim"></div>
</div>

<div class="container hero__inner">
  <div class="hero__copy">
    <p class="kicker">{{ i18n.dict().hero.kicker }}</p>
    <h1 class="hero__name">{{ i18n.dict().hero.headlineMain }}</h1>
    <p class="hero__role">{{ i18n.dict().hero.headlineAccent }}</p>
    <p class="hero__lede">{{ i18n.dict().hero.lede }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" routerLink="/" fragment="studio">{{ i18n.dict().hero.ctaPrimary }}</a>
      <a class="btn btn--secondary" href="https://github.com/Kounrisu" target="_blank" rel="noopener noreferrer">
        {{ i18n.dict().hero.ctaSecondary }}
      </a>
    </div>
  </div>
</div>
