<div class="hero__bg" aria-hidden="true">
  @if (!videoFailed()) {
    <video
      #videoEl
      class="hero__video"
      autoplay
      [muted]="true"
      [defaultMuted]="true"
      loop
      playsinline
      preload="auto"
      (error)="onVideoError()"
    >
      <source src="videos/hero-intro.mp4" type="video/mp4" />
    </video>
  }
  <div class="hero__scrim"></div>
</div>

<div class="container hero__inner">
  <div class="hero__copy">
    <p class="kicker">{{ i18n.dict().hero.kicker }}</p>
    <h1 class="hero__name">{{ i18n.dict().hero.headlineMain }}</h1>
    <p class="hero__role">{{ i18n.dict().hero.headlineAccent }}</p>
    <p class="hero__lede">{{ i18n.dict().hero.lede }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" routerLink="/" fragment="studio">{{ i18n.dict().hero.ctaPrimary }}</a>
      <a class="btn btn--secondary" href="https://github.com/Kounrisu" target="_blank" rel="noopener noreferrer">
        {{ i18n.dict().hero.ctaSecondary }}
      </a>
    </div>
  </div>
</div>

@if (!videoFailed()) {
  <button type="button" class="hero__sound" (click)="toggleMute()">
    <mat-icon aria-hidden="true">{{ muted() ? 'volume_off' : 'volume_up' }}</mat-icon>
    <!-- The visible label states the action, so it is the button's
         accessible name too — no aria-label or aria-pressed needed, and
         nothing for a screen reader and a sighted user to disagree about. -->
    <span>{{ muted() ? i18n.dict().common.soundOn : i18n.dict().common.soundOff }}</span>
  </button>
}
